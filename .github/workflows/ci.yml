name: CaterFlow verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    name: Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check public-source hygiene and history
        run: python scripts/check_public_source.py
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-ai.txt Pillow==13.0.0
          npm ci --ignore-scripts
      - name: Test deterministic and mocked provider workflows
        env:
          CATERFLOW_AI_ENABLED: 'false'
          CATERFLOW_PAYPAL_ENABLED: 'false'
          CATERFLOW_TURNSTILE_ENABLED: 'false'
        run: |
          python -m unittest discover -s tests
          npm test
