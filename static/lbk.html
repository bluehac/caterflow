 let photoRevision=0;
 for(const camera of [true,false]){const label=node('label',camera?tr('📷 Tomar foto','📷 Take a photo'):tr('🖼 Subir foto','🖼 Upload a photo')),file=node('input');file.type='file';file.accept='image/jpeg,image/png,image/webp';file.id=camera?'camera-photo':'upload-photo';label.htmlFor=file.id;if(camera)file.setAttribute('capture','environment');
 file.onchange=async()=>{const version=++photoRevision;assistantPhoto=null;photoConsent=false;consent.checked=false;preview.hidden=true;invalidate();photoBusy=true;draftButton.disabled=true;try{const result=await IntakeMedia.preparePhoto(file.files[0]);if(version!==photoRevision||!panel.isConnected)return;assistantPhoto=result;preview.src=result;preview.hidden=false;status.textContent=tr('Foto lista. Confirma el permiso antes de enviarla.','Photo ready. Confirm permission before sending it.');}catch(e){if(version===photoRevision)status.textContent=e.message;}finally{if(version===photoRevision){photoBusy=false;draftButton.disabled=!aiAvailable;}}};tools.append(label,file);}
 const consent=node('input');consent.type='checkbox';consent.id='photo-consent';consent.checked=photoConsent;consent.onchange=()=>{photoConsent=consent.checked;invalidate();};const label=node('label',tr('Autorizo enviar esta foto a la IA para una sugerencia.','I permit sending this photo to AI for a suggestion.'));label.htmlFor=consent.id;tools.append(preview,consent,label);
 const remove=IntakeMedia.button(tr('Quitar foto','Remove photo'),()=>{photoRevision++;photoBusy=false;assistantPhoto=null;photoConsent=false;consent.checked=false;preview.removeAttribute('src');preview.hidden=true;panel.querySelectorAll('input[type=file]').forEach(i=>i.value='');invalidate();draftButton.disabled=!aiAvailable;});tools.append(remove);
}
const draftButton=IntakeMedia.button(tr('Preparar mi solicitud','Prepare my request'),async()=>{
 if(photoBusy)return;if(assistantPhoto&&!photoConsent){status.textContent=tr('Confirma el permiso de la foto o quítala.','Confirm photo permission or remove the photo.');return;}
 if(!text.value.trim()&&!assistantPhoto){status.textContent=tr('Describe tu idea o elige una foto.','Describe your idea or choose a photo.');return;}
 const version=++requestRevision,requestLanguage=lang;currentDraft=null;review.replaceChildren();draftButton.disabled=true;
 try{const payload={text:text.value,language:lang};if(assistantPhoto)payload.photo={base64:assistantPhoto.split(',')[1],consent:true};const response=await api('ai/draft',payload);if(version!==requestRevision||lang!==requestLanguage||!panel.isConnected)return;
 currentDraft=response.result.draft;review.append(node('h3',tr('¿Entendimos bien?','Did we understand you?')),node('p',tr('Revisa o escucha. Puedes corregir el texto y preparar otra sugerencia. Aún no se ha enviado la solicitud.','Review or listen. You can correct the text and prepare another suggestion. Your inquiry has not been sent.')));
 const summary=node('dl');for(const key of ['title','guests','event_date','location','menu_notes','dietary_notes']){summary.append(node('dt',copy[lang].labels[key]),node('dd',currentDraft[key]===null?tr('Por confirmar','To confirm'):String(currentDraft[key])));}review.append(summary);IntakeMedia.listenButton(review,()=>summary.innerText,status);
 const question=node('p',currentDraft.next_question);review.append(question);IntakeMedia.listenButton(review,()=>question.textContent,status);
 const accept=IntakeMedia.button(tr('Usar estos detalles y revisar el formulario','Use these details and review the form'),()=>{if(version!==requestRevision||!currentDraft)return;for(const key of ['title','guests','event_date','location','menu_notes','dietary_notes'])if(currentDraft[key]!==null&&currentDraft[key]!==undefined)data[key]=currentDraft[key];assistantPhoto=null;photoConsent=false;render();document.getElementById('stepTitle').focus();});review.append(accept);
 }catch(error){if(error.sessionExpired){render();status.textContent=copy[lang].sessionExpired;}else if(version===requestRevision)review.append(node('p',tr('No se pudo preparar. Tus detalles siguen aquí; puedes completar el formulario.','Could not prepare a suggestion. Your details remain here; you can complete the form.')));}finally{if(panel.isConnected)draftButton.disabled=!aiAvailable||photoBusy;}
});draftButton.disabled=!aiAvailable;tools.append(draftButton,review);if(!aiAvailable)tools.append(node('p',tr('Inicia sesión con una cuenta de cliente para preparar sugerencias de IA. Puedes usar el dictado y completar el formulario.','Sign in with a customer account to prepare AI suggestions. You can use dictation and complete the form.')));fields.append(panel);
}

async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{...(typeof BotGuard!=='undefined'?await BotGuard.headers(path):{}),'Content-Type':'application/json','X-CSRF-Token':csrf,...(path==='intake'?{'Idempotency-Key':requestKey}:{})}:{},body:body?JSON.stringify(body):undefined});const b=await r.json();if(!r.ok){const error=Error(b.error);error.sessionExpired=r.status===403&&b.error==='Please sign in';if(error.sessionExpired){authenticated=false;csrf='';aiAvailable=false;photoAvailable=false;}throw error;}return b}
form.onsubmit=async e=>{e.preventDefault();if(sending)return;if(step<3){step++;render();document.getElementById('stepTitle').focus();return}const b=document.getElementById('next');sending=true;b.disabled=true;try{if(!authenticated){await api('login',{id:form.elements.id.value,password:form.elements.password.value});const s=await api('events');if(s.user.role!=='customer')throw Error('Customer account required');csrf=s.csrf;authenticated=true}await api('intake',{...data,language:lang});fields.replaceChildren(node('p',copy[lang].sent));document.getElementById('stepTitle').textContent=lang==='en'?'Inquiry received':'Solicitud recibida';b.hidden=true;document.getElementById('back').hidden=true;document.getElementById('language').disabled=true;status.textContent=''}catch(e){if(e.sessionExpired){render();status.textContent=copy[lang].sessionExpired;}else{status.textContent=copy[lang].failed+e.message;}}finally{sending=false;b.disabled=false}};
document.getElementById('back').onclick=()=>{step--;render()};document.getElementById('language').onclick=()=>{lang=lang==='en'?'es':'en';render()};render();
api('events').then(s=>{if(s.user.role==='customer'){authenticated=true;csrf=s.csrf;aiAvailable=s.ai_drafting===true;photoAvailable=s.photo_intake===true;render()}}).catch(()=>{});
</script></html>
