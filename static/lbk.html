<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan your event | La Bandera Kitchen</title><style>
:root{font-family:system-ui,sans-serif;color:#28251f;background:#fbf8f1}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #ded8ca;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.08em;font-size:15px}main{max-width:1120px;margin:auto;padding:48px 24px;display:grid;grid-template-columns:1fr 1fr;gap:64px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.15em;color:#975230}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(42px,6vw,70px);line-height:1.04;letter-spacing:-2px;margin:20px 0}p{line-height:1.65;color:#625d51}.line{height:5px;width:64px;background:#a74c30;margin:30px 0}section{background:white;border:1px solid #e1dbd0;border-radius:24px;padding:30px;box-shadow:0 15px 45px #38271609}h2{font-size:23px;margin:12px 0 24px}label{display:block;font-size:14px;font-weight:650;margin:18px 0 7px}input,select,textarea,button{font:inherit;border-radius:10px;width:100%;padding:13px;min-height:48px}input,select,textarea{border:1px solid #bcb6aa;background:white}textarea{min-height:100px}button{background:#943e29;color:white;border:0;font-weight:700;margin-top:22px;cursor:pointer}.secondary{background:transparent;color:#6b4a37;border:1px solid #cbbdab;margin-top:10px}.lang{width:auto;margin:0;background:transparent;color:#483a2d;border:1px solid #cbbdab;padding:8px 14px;font-size:13px}progress{width:100%;height:7px;accent-color:#943e29}small{font-size:12px;color:#756c5f}.pill{display:inline-block;border:1px solid #d9c6b7;border-radius:20px;padding:6px 10px;font-size:11px;color:#76422f}.error{color:#a02424}#status{min-height:24px}.checks{display:flex;align-items:flex-start;gap:10px}.checks input{width:20px;min-height:20px;margin-top:20px}dl{margin:0}dt{font-size:12px;color:#6e655a;margin-top:14px}dd{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}footer{margin-top:28px;font-size:12px;color:#756c5f}a{color:#943e29}@media(max-width:720px){main{grid-template-columns:1fr;gap:24px;padding-top:30px}h1{max-width:400px;margin-bottom:12px}.intro p{margin-bottom:0}.line{margin:20px 0}section{padding:22px}header{padding:16px 20px}}
</style><header><div class="brand">LA BANDERA KITCHEN</div><button class="lang" id="language" type="button">Español</button></header><main><div class="intro"><span class="eyebrow" id="eyebrow"></span><h1 id="headline"></h1><div class="line"></div><p id="intro"></p><span class="pill" id="badge"></span><footer id="disclosure"></footer></div><section aria-labelledby="stepTitle"><small id="stepLabel"></small><progress max="4" value="1" id="progress" aria-label="Form progress"></progress><h2 id="stepTitle" tabindex="-1"></h2><form id="form"><div id="fields"></div><p id="status" class="error" role="status" aria-live="polite"></p><button id="next" type="submit"></button><button id="back" type="button" class="secondary"></button></form><footer>Powered by AIZOYA CaterFlow · <a href="/">Caterer workspace</a></footer></section></main><script>
const copy={en:{eyebrow:'CATERING FOR YOUR NEXT GATHERING',headline:'Bring people together. We’ll help with the food.',intro:'Tell us what you’re planning. Review your event brief, then let the caterer prepare your quote.',badge:'Sandbox development preview',disclosure:'Synthetic details only. This page is not connected to LBK’s public website. No payment is collected. AI suggestions require an authorized connection and sign-in. PayPal checkout is handled separately in the workspace.',steps:['Your event','Food & service','Your details','Review your inquiry'],labels:{title:'What are you celebrating?',event_date:'Event date',guests:'Number of guests (minimum 10)',location:'Event city or venue',service:'Service preference',menu_notes:'What would you like to serve?',dietary_notes:'Dietary needs or allergies to discuss',contact_name:'Your name',contact_email:'Email address',consent:'I agree that these details may be used to respond to this catering inquiry.'},next:'Continue',back:'Back',submit:'Send inquiry for review',login:'Use a customer demo account to send this inquiry. Enter the account name exactly as created; capital letters matter.',account:'Demo account',password:'Password',sent:'Inquiry saved. Your quote will require caterer review. Your event is not booked.',failed:'Please check your details. ',select:['Choose an option','Delivery','Pickup','Staffed service','Help me decide'],review:'Review your details. Sending an inquiry does not reserve a date or approve a price.'},es:{eyebrow:'CATERING PARA TU PRÓXIMA REUNIÓN',headline:'Reúne a tu gente. Nosotros ayudamos con la comida.',intro:'Cuéntanos qué estás planeando. Revisa los detalles de tu evento para que el equipo prepare tu cotización.',badge:'Vista previa de desarrollo sandbox',disclosure:'Solo datos ficticios. Esta página no está conectada al sitio público de LBK. No se cobran pagos. Las sugerencias de IA requieren conexión autorizada e inicio de sesión. PayPal se gestiona por separado en el espacio de trabajo.',steps:['Tu evento','Comida y servicio','Tus datos','Revisa tu solicitud'],labels:{title:'¿Qué estás celebrando?',event_date:'Fecha del evento',guests:'Número de invitados (mínimo 10)',location:'Ciudad o lugar del evento',service:'Preferencia de servicio',menu_notes:'¿Qué te gustaría servir?',dietary_notes:'Necesidades alimentarias o alergias que debemos conversar',contact_name:'Tu nombre',contact_email:'Correo electrónico',consent:'Acepto que estos datos se utilicen para responder a esta solicitud de catering.'},next:'Continuar',back:'Atrás',submit:'Enviar solicitud para revisión',login:'Usa una cuenta de cliente de demostración para enviar. Escribe el nombre de cuenta tal como se creó; las mayúsculas importan.',account:'Cuenta de demostración',password:'Contraseña',sent:'Solicitud guardada. La cotización requiere revisión del equipo. Tu evento aún no está reservado.',failed:'Revisa tus datos. ',select:['Elige una opción','Entrega','Recogida','Servicio con personal','Ayúdame a decidir'],review:'Revisa tus datos. Esta solicitud no reserva una fecha ni aprueba un precio.'}};
const detailLabels={"event_time": ["Meal or service time (optional)", "Hora de comida o servicio (opcional)"], "venue_address": ["Venue address and access (optional)", "Dirección y acceso al lugar (opcional)"], "primary_protein": ["Preferred main protein (optional)", "Proteína principal preferida (opcional)"], "second_protein": ["Second protein request (optional)", "Solicitud de segunda proteína (opcional)"], "extra_sides": ["Extra side requests (optional)", "Guarniciones adicionales (opcional)"], "dessert": ["Dessert requests (quoted separately)", "Postres (cotización por separado)"], "beverages": ["Water, soda or other drinks (quoted separately)", "Agua, refrescos u otras bebidas (cotización por separado)"], "accessibility_notes": ["Accessibility, delivery, setup or staffing details (optional)", "Accesibilidad, entrega, montaje o personal (opcional)"], "organization": ["Organization (optional)", "Organización (opcional)"], "phone": ["Phone number (optional)", "Teléfono (opcional)"], "budget_range": ["Approximate total budget, USD (optional)", "Presupuesto total aproximado, USD (opcional)"], "referral_source": ["How did you find us? (optional)", "¿Cómo nos encontraste? (opcional)"]};
for(const [key,pair] of Object.entries(detailLabels)){copy.en.labels[key]=pair[0];copy.es.labels[key]=pair[1]}
let lang='en',step=0,csrf='',authenticated=false,sending=false,aiAvailable=false;const requestKey=crypto.randomUUID();const data={service:'',consent:false};const form=document.getElementById('form'),fields=document.getElementById('fields'),status=document.getElementById('status');
function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function input(key,type='text'){const c=copy[lang],l=node('label',c.labels[key]),i=node(type==='textarea'?'textarea':type==='select'?'select':'input');i.id=key;i.name=key;l.htmlFor=key;if(type!=='textarea'&&type!=='select')i.type=type;i.required=!['menu_notes','dietary_notes',...Object.keys(detailLabels)].includes(key);if(type==='select'){['','delivery','pickup','staffed','unsure'].forEach((v,j)=>{const o=node('option',c.select[j]);o.value=v;i.append(o)})}if(type==='date'){const d=new Date();i.min=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}if(type==='number'){i.min=10;i.max=1000}i.maxLength=key in detailLabels?(key==='accessibility_notes'?500:200):key==='contact_email'?254:key==='location'?240:type==='textarea'?1000:120;i.value=data[key]??'';i.oninput=()=>{data[key]=type==='number'?Number(i.value):i.value};fields.append(l,i)}
function render(){const c=copy[lang];document.documentElement.lang=lang;for(const k of ['eyebrow','headline','intro','badge','disclosure'])document.getElementById(k).textContent=c[k];document.getElementById('language').textContent=lang==='en'?'Español':'English';document.getElementById('stepLabel').textContent=(step+1)+' / 4';document.getElementById('progress').value=step+1;document.getElementById('stepTitle').textContent=c.steps[step];fields.replaceChildren();status.textContent='';document.getElementById('next').textContent=step===3?c.submit:c.next;document.getElementById('back').textContent=c.back;document.getElementById('back').hidden=step===0;
if(step===0){if(aiAvailable)aiPanel();input('title');input('event_date','date');input('guests','number');input('location');input('event_time');input('venue_address')}
if(step===1){input('service','select');input('menu_notes','textarea');input('dietary_notes','textarea');for(const key of ['primary_protein','second_protein','extra_sides','dessert','beverages','accessibility_notes'])input(key,key==='accessibility_notes'?'textarea':'text')}
if(step===2){input('contact_name');input('contact_email','email');input('phone','tel');input('organization');input('budget_range');input('referral_source');const w=node('div');w.className='checks';const i=node('input');i.type='checkbox';i.id='consent';i.required=true;i.checked=data.consent;i.onchange=()=>data.consent=i.checked;const l=node('label',c.labels.consent);l.htmlFor='consent';w.append(i,l);fields.append(w)}
if(step===3){fields.append(node('p',c.review));const dl=node('dl');Object.entries(c.labels).filter(([k])=>k!=='consent').forEach(([k,v])=>{dl.append(node('dt',v),node('dd',k==='service'?c.select[['','delivery','pickup','staffed','unsure'].indexOf(data[k])]:String(data[k]||'—')))});fields.append(dl);if(!authenticated){fields.append(node('p',c.login));for(const [k,label,type] of [['id',c.account,'text'],['password',c.password,'password']]){const l=node('label',label),i=node('input');i.name=k;i.id=k;i.type=type;i.required=true;i.autocomplete=k==='password'?'current-password':'username';if(k==='id'){i.autocapitalize='none';i.spellcheck=false;}l.htmlFor=k;fields.append(l,i)}}}}

function aiPanel(){const details=node('details'),summary=node('summary',lang==='es'?'Ayúdame a completar los detalles':'Help me fill in the details');details.append(summary);const text=node('textarea');text.maxLength=4000;text.placeholder=lang==='es'?'Describe tu evento con datos ficticios':'Describe your event using synthetic details';text.setAttribute('aria-label',text.placeholder);const draftButton=node('button',lang==='es'?'Preparar sugerencia':'Prepare suggestion');draftButton.type='button';const review=node('div');details.append(text,draftButton,review);fields.append(details);draftButton.onclick=async()=>{draftButton.disabled=true;review.replaceChildren();try{const response=await api('ai/draft',{text:text.value,language:lang});const draft=response.result.draft;review.append(node('p',lang==='es'?'Revisa la sugerencia. Aún no se ha guardado.':'Review the suggestion. Nothing has been saved yet.'));for(const [key,value] of Object.entries(draft))if(value!==null)review.append(node('p',(copy[lang].labels[key]|| (lang==='es'?'Pregunta':'Question'))+': '+value));const apply=node('button',lang==='es'?'Usar estos detalles y revisar':'Use these details and review');apply.type='button';apply.onclick=()=>{for(const key of ['title','guests','event_date','location','menu_notes','dietary_notes'])if(draft[key]!==null&&draft[key]!==undefined)data[key]=draft[key];render()};review.append(apply)}catch{review.append(node('p',lang==='es'?'No se pudo preparar la sugerencia. Completa el formulario.':'Suggestion unavailable. You can fill in the form.'))}finally{draftButton.disabled=false}}}

async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf,...(path==='intake'?{'Idempotency-Key':requestKey}:{})}:{},body:body?JSON.stringify(body):undefined});const b=await r.json();if(!r.ok)throw Error(b.error);return b}
form.onsubmit=async e=>{e.preventDefault();if(sending)return;if(step<3){step++;render();document.getElementById('stepTitle').focus();return}const b=document.getElementById('next');sending=true;b.disabled=true;try{if(!authenticated){await api('login',{id:form.elements.id.value,password:form.elements.password.value});const s=await api('events');if(s.user.role!=='customer')throw Error('Customer account required');csrf=s.csrf;authenticated=true}await api('intake',{...data,language:lang});fields.replaceChildren(node('p',copy[lang].sent));document.getElementById('stepTitle').textContent=lang==='en'?'Inquiry received':'Solicitud recibida';b.hidden=true;document.getElementById('back').hidden=true;document.getElementById('language').disabled=true;status.textContent=''}catch(e){status.textContent=copy[lang].failed+e.message}finally{sending=false;b.disabled=false}};
document.getElementById('back').onclick=()=>{step--;render()};document.getElementById('language').onclick=()=>{lang=lang==='en'?'es':'en';render()};render();
api('events').then(s=>{if(s.user.role==='customer'){authenticated=true;csrf=s.csrf;aiAvailable=s.ai_drafting===true;render()}}).catch(()=>{});
</script></html>
