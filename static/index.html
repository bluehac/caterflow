<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIZOYA CaterFlow</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#FFFFFF;background:#071C45;color-scheme:dark;--navy:#071C45;--surface:#102B56;--blue:#087CF0;--cyan:#0BA5F5;--gold:#D7B06A}*{box-sizing:border-box}body{margin:0}header,main{max-width:680px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #FFFFFF26}header strong{letter-spacing:.02em}small,.muted{color:#D5E5FF}small{font-size:12px;letter-spacing:.08em}main>small{color:var(--gold);font-weight:700}h1{font-size:38px;letter-spacing:-1.5px;line-height:1.1;margin:12px 0}h2{font-size:23px}p{line-height:1.5}section{background:var(--surface);border:1px solid #FFFFFF30;border-top:3px solid var(--blue);border-radius:22px;padding:24px;margin:20px 0;box-shadow:0 12px 32px #00000026}label{display:block;font-weight:600;margin:18px 0 7px}input,textarea,button{font:inherit;width:100%;border-radius:12px;padding:14px}input,textarea{border:1px solid #B4C8E2;background:#FFFFFF;color:var(--navy);color-scheme:light}input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button{border:0;background:var(--cyan);color:var(--navy);font-weight:750;min-height:50px;margin-top:18px;cursor:pointer}button:hover:not(:disabled){background:#FFFFFF}button:disabled{background:#344B6E;color:#CFDBED;cursor:default}.tag{background:var(--surface);color:var(--gold);border:1px solid var(--gold);padding:7px 11px;border-radius:30px;font-size:12px}.price{font-size:32px;font-weight:700}.error{color:#FFB8B0;white-space:pre-wrap}footer{font-size:12px;padding:20px;color:#D5E5FF;line-height:1.6}progress{width:100%;accent-color:var(--cyan)}.secondary{background:transparent;color:#FFFFFF;border:1px solid var(--cyan)}.secondary:hover:not(:disabled){background:var(--surface);color:#FFFFFF}a{color:#72CFFF}@media(max-width:440px){header,main{padding:20px}header{gap:10px}header strong{font-size:15px}h1{font-size:3 /* Workspace layout: give each event and its controls a clear visual boundary. */
:root{background:#08152d;--surface:#132440;--gold:#e4bb74}
body{background:radial-gradient(ellipse at top,#192f50 0,transparent 34rem),#08152d;min-height:100vh}
header,main{max-width:760px;padding-inline:clamp(16px,5vw,36px)}
header{padding-block:20px;border-bottom-color:#ffffff18}
.tag{background:#e4bb7412;border-color:#e4bb7455}
main{padding-top:clamp(28px,7vw,52px)}
h1{font-family:Georgia,serif;font-size:clamp(34px,7vw,58px);font-weight:500;line-height:1.04;letter-spacing:-.045em;max-width:16ch}
h2{margin:0;font-size:clamp(20px,4.5vw,26px);letter-spacing:-.025em}
#root{display:grid;gap:20px;margin-top:24px;min-width:0}
#root>p{margin:0}
section{display:flex;flex-direction:column;gap:12px;margin:0;padding:clamp(16px,4vw,28px);min-width:0;border:1px solid #a9bddd38;border-radius:20px;background:linear-gradient(145deg,#192d4c,#12213a);box-shadow:0 14px 32px #03091b42}

section form{display:grid;gap:8px;margin-top:8px}

section button,#root>button{margin:0;min-height:48px}

button{background:#a9d9ff;transition:background .15s ease}

.quote-summary{display:grid;gap:8px;padding:16px;border-radius:14px;border:1px solid #a9bddd30;background:#08152d80}
.quote-summary .price{font-size:clamp(24px,6vw,34px);line-height:1.15;font-variant-numeric:tabular-nums}
.quote-summary small{letter-spacing:0;line-height:1.45}
.quote-actions{display:grid;gap:10px;margin-top:8px}

</style><header><strong>AIZOYA / CaterFlow</strong><span class="tag">Development build</span></header><main><small>CATERING, ONE CLEAR STEP AT A TIME</small><h1>From a good idea<br>to a great gathering.</h1><p class="muted">Plan your event. Review your quote. Keep every approval clear.</p><p id="notice" role="status" class="error"></p><div id="root"></div><footer>Working title. Synthetic test data only. Provider connections require authorized configuration. No real money moves.</footer></main><script src="/botguard.js"></script><script>
/* Shared browser-only accessibility controls. No recording persistence or analytics. */
const IntakeMedia=(()=>{
  let recognition=null,revision=0;
  const t=(es,en)=>document.documentElement?.lang==='es'?es:en;
  const button=(text,action)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=action;return b;};
  function stop(){revision++;if(recognition){recognition.abort();recognition=null;}if('speechSynthesis' in window)window.speechSynthesis.cancel();}
  function speak(text,status){
    if(!('speechSynthesis' in window)){if(status)status.textContent=t('La lectura en voz alta no está disponible. Puedes leer o editar el texto.','Read-aloud is unavailable. You can read or edit the text.');return;}
    window.speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(String(text).slice(0,7000));
    utterance.lang=document.documentElement?.lang==='es'?'es-US':'en-US';utterance.rate=.9;
    const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith(utterance.lang.slice(0,2)));
    if(voice)utterance.voice=voice;
    utterance.onerror=()=>{if(status)status.textContent=t('No se pudo leer. El texto sigue disponible.','Read-aloud failed. The text is still available.');};
    window.speechSynthesis.speak(utterance);
  }
  function listenButton(parent,text,status){const b=button(t('🔊 Escuchar','🔊 Listen'),()=>speak(typeof text==='function'?text():text,status));parent.append(b);return b;}
  function voice(parent,text,status,changed){
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    const consent=document.createElement('p');consent.textContent=t('Al tocar Hablar, autorizas el micrófono. Tu navegador puede enviar audio a su servicio de voz. Revisa la transcripción antes de enviarla a la IA. No grabamos ni guardamos audio aquí.','Tapping Speak permits microphone use. Your browser may send audio to its speech service. Review the transcript before sending it to AI. We do not record or save audio here.');parent.append(consent);listenButton(parent,()=>consent.textContent,status);
    const talk=button(t('🎙 Hablar','🎙 Speak'),()=>{
      if(recognition){recognition.stop();return;}
      if(!Recognition){status.textContent=t('Usa el micrófono del teclado o escribe. Este navegador no ofrece reconocimiento de voz.','Use keyboard dictation or type. This browser does not offer speech recognition.');return;}
      if('speechSynthesis' in window)window.speechSynthesis.cancel();
      const token=revision,base=text.value;let current='';recognition=new Recognition();const active=recognition;
      active.lang=document.documentElement?.lang==='es'?'es-US':'en-US';active.continuous=false;active.interimResults=true;
      active.onresult=e=>{
        if(token!==revision)return;
        current=Array.from(e.results).map(r=>r[0].transcript).join(' ');
        text.value=(base+(base?'\n':'')+current).slice(0,4000);changed();
        status.textContent=t('Revisa y corrige lo que escuchamos.','Review and correct what we heard.');
      };
      active.onerror=()=>{if(token===revision)status.textContent=t('No se pudo escuchar. Puedes escribir o usar el dictado del teclado.','Could not listen. You can type or use keyboard dictation.');};
      active.onend=()=>{if(recognition===active)recognition=null;talk.textContent=t('🎙 Hablar','🎙 Speak');};
      try{active.start();talk.textContent=t('■ Terminar de hablar','■ Stop speaking');status.textContent=t('Escuchando…','Listening…');}
      catch{recognition=null;status.textContent=t('No se pudo activar el micrófono. Puedes escribir.','Microphone unavailable. You can type.');}
    });parent.append(talk);
    const note=document.createElement('p');note.textContent=t('Habla en el idioma seleccionado; si mezclas idiomas, revisa nombres, fechas y cantidades.','Speak in the selected language; if you mix languages, check names, dates and quantities.');parent.append(note);
  }
  async function preparePhoto(file){
    if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8_000_000)throw Error(t('Elige una foto JPEG, PNG o WebP de hasta 8 MB.','Choose a JPEG, PNG or WebP photo up to 8 MB.'));
    const url=URL.createObjectURL(file);
    try{
      const image=new Image();image.src=url;await image.decode();
      if(!image.naturalWidth||image.naturalWidth*image.naturalHeight>24_000_000)throw Error(t('Elige una foto más pequeña.','Choose a smaller photo.'));
      const scale=Math.min(1,1280/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);
      let result=canvas.toDataURL('image/jpeg',.8);
      if(result.length>533000)result=canvas.toDataURL('image/jpeg',.5);
      if(result.length>533000)throw Error(t('Elige una foto más pequeña.','Choose a smaller photo.'));
      return result;
    }finally{URL.revokeObjectURL(url);}
  }
  if(typeof window!=='undefined' && window.addEventListener)window.addEventListener('pagehide',stop);
  return {stop,speak,voice,listenButton,preparePhoto,button};
})();


let csrf='',user;const root=document.getElementById('root'),notice=document.getElementById('notice');
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function field(form,label,name,type='text',value=''){const l=el('label',label),i=el(type==='textarea'?'textarea':'input');i.name=name;i.id='field-'+name;l.htmlFor=i.id;if(type!=='textarea')i.type=type;i.value=value;i.required=true;if(type==='number'){i.min=1;i.max=1000}form.append(l,i);return i}
function button(parent,text,fn,disabled=false){const b=el('button',text);b.type='button';b.disabled=disabled;b.onclick=()=>run(fn);parent.append(b);return b}
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{...(typeof BotGuard!=='undefined'?await BotGuard.headers(path):{}),'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data}
async function run(fn){notice.textContent='';try{await fn()}catch(e){notice.textContent=e.message}}
function login(){root.replaceChildren();const s=el('section'),f=el('form');s.append(el('h2','Welcome back'));const account=field(f,'Account name','id');account.autocomplete='username';account.autocapitalize='none';account.spellcheck=false;field(f,'Password','password','password').autocomplete='current-password';f.append(el('p','Use the account name exactly as created. Capital letters matter.'));f.onsubmit=e=>{e.preventDefault();run(async()=>{await api('login',Object.fromEntries(new FormData(f)));await load()})};const b=el('button','Sign in');b.type='submit';f.append(b);s.append(f);root.append(s)}
async function load(){const d=await api('events');csrf=d.csrf;user=d.user;root.replaceChildren();const top=el('p','Signed in as '+user.id+' · '+user.role);root.append(top);if(user.role==='customer'){const s=el('section'),link=el('a','Plan a catering event');link.href='/catering';s.append(el('h2','Your next gathering'),el('p','Share your event, menu, service and contact details in one guided form.'),link);root.append(s)}if(!d.events.length){root.append(el('p',user.role==='caterer'?'No inquiries yet. Customer requests will appear here for your review.':'No inquiries yet. Start with your event details above.'))}
for(const e of d.events){const s=el('section');s.append(el('h2',e.title),el('p',e.guests+' guests'),el('p',e.notes));const q=e.quotes[0],terms=q?.terms?JSON.parse(q.terms):null;if(q){const progress=el('progress');progress.max=4;progress.value=q.payment_status==='REVIEW_REQUIRED'?2:q.booked?4:q.capture_id&&q.payment_status==='COMPLETED'?3:q.customer_approved?2:1;const summary=el('div');summary.className='quote-summary';const total=el('p','$'+q.total+' USD');total.className='price';summary.append(progress,el('small','Quote revision '+q.revision),total);s.append(summary);if(terms){for(const [label,amount] of [['Food',terms.food],['Service fee',terms.service_fee],['Example tax',terms.tax],['Deposit due',terms.deposit_due],['Remaining balance after deposit',terms.balance_due]])summary.append(el('p',label+': $'+amount+' USD'));summary.append(el('small','Synthetic pricing and tax for demonstration only.'))}if(q.payment_status==='REVIEW_REQUIRED'){s.append(el('h2','Payment needs review'),el('p','The caterer must review this payment before booking can proceed. Do not send another payment.'))}else if(q.booked&&q.payment_status==='COMPLETED')s.append(el('h2','Booking confirmed'));else if(q.capture_id&&q.payment_status==='COMPLETED'){s.append(el('p',terms?'Deposit verified. Awaiting caterer confirmation.':'Payment verified. Awaiting caterer confirmation.'));if(user.role==='caterer')button(s,'Confirm booking',async()=>{await api('book',{quote:q.id});load()})}else if(!q.customer_approved&&user.role==='customer')button(s,'Approve this quote',async()=>{await api('approve',{quote:q.id});load()});else {s.append(el('p',q.customer_approved?'Quote approved.':'Waiting for customer approval.'));if(q.customer_approved&&user.role==='customer'){if(d.sandbox_checkout){if(!q.order_id)button(s,terms?'Pay deposit in PayPal sandbox':'Continue to PayPal sandbox',async()=>{const r=await api('payment/create',{quote:q.id});window.location.assign(r.result.approval_url)});else {button(s,'Verify and complete sandbox payment',async()=>{await api('payment/capture',{quote:q.id});await load()});button(s,'Refresh payment status',async()=>{await api('payment/reconcile',{quote:q.id});await load()}).className='secondary'}}else s.append(el('p','Sandbox checkout connection required.'))}}}
IntakeMedia.listenButton(s,()=>s.innerText,notice);if(d.synthetic_deposits&&user.role==='caterer'&&(!q||(!q.order_id&&!q.capture_id&&q.payment_status==='UNPAID'))){const box=el('div');box.className='quote-actions';for(const service of ['delivery','pickup'])button(box,(q?.customer_approved?'Correct quote: ':'Send sample quote: ')+service,async()=>{await api('quote',{event:e.id,service,...(q?.customer_approved?{corrects:q.id}:{})});await load()});s.append(box)}else if(user.role==='caterer'&&(!q||!q.customer_approved)){const f=el('form');const input=field(f,'Price per guest, USD','price','text','25.00');button(f,q?'Approve a new quote revision':'Approve and send quote',async()=>{await api('quote',{event:e.id,price:input.value});load()});s.append(f)}root.append(s)}button(root,'Sign out',async()=>{await api('logout',{});login()}).className='secondary'}
run(async()=>{try{await load()}catch{login()}});
</script></html>
