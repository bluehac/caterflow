<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIZOYA CaterFlow</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#FFFFFF;background:#071C45;color-scheme:dark;--navy:#071C45;--surface:#102B56;--blue:#087CF0;--cyan:#0BA5F5;--gold:#D7B06A}*{box-sizing:border-box}body{margin:0}header,main{max-width:680px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #FFFFFF26}header strong{letter-spacing:.02em}small,.muted{color:#D5E5FF}small{font-size:12px;letter-spacing:.08em}main>small{color:var(--gold);font-weight:700}h1{font-size:38px;letter-spacing:-1.5px;line-height:1.1;margin:12px 0}h2{font-size:23px}p{line-height:1.5}section{background:var(--surface);border:1px solid #FFFFFF30;border-top:3px solid var(--blue);border-radius:22px;padding:24px;margin:20px 0;box-shadow:0 12px 32px #00000026}label{display:block;font-weight:600;margin:18px 0 7px}input,textarea,button{font:inherit;width:100%;border-radius:12px;padding:14px}input,textarea{border:1px solid #B4C8E2;background:#FFFFFF;color:var(--navy);color-scheme:light}input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button{border:0;background:var(--cyan);color:var(--navy);font-weight:750;min-height:50px;margin-top:18px;cursor:pointer}button:hover:not(:disabled){background:#FFFFFF}button:disabled{background:#344B6E;color:#CFDBED;cursor:default}.tag{background:var(--surface);color:var(--gold);border:1px solid var(--gold);padding:7px 11px;border-radius:30px;font-size:12px}.price{font-size:32px;font-weight:700}.error{color:#FFB8B0;white-space:pre-wrap}footer{font-size:12px;padding:20px;color:#D5E5FF;line-height:1.6}progress{width:100%;accent-color:var(--cyan)}.secondary{background:transparent;color:#FFFFFF;border:1px solid var(--cyan)}.secondary:hover:not(:disabled){background:var(--surface);color:#FFFFFF}a{color:#72CFFF}@media(max-width:440px){header,main{padding:20px}header{gap:10px}header strong{font-size:15px}h1{font-size:36px}section{padding:22px}}
</style><header><strong>AIZOYA / CaterFlow</strong><span class="tag">Development build</span></header><main><small>CATERING, ONE CLEAR STEP AT A TIME</small><h1>From a good idea<br>to a great gathering.</h1><p class="muted">Plan your event. Review your quote. Keep every approval clear.</p><p id="notice" role="status" class="error"></p><div id="root"></div><footer>Working title. Synthetic test data only. Provider connections require authorized configuration. No real money moves.</footer></main><script>
let csrf='',user;const root=document.getElementById('root'),notice=document.getElementById('notice');
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function field(form,label,name,type='text',value=''){const l=el('label',label),i=el(type==='textarea'?'textarea':'input');i.name=name;i.id='field-'+name;l.htmlFor=i.id;if(type!=='textarea')i.type=type;i.value=value;i.required=true;if(type==='number'){i.min=1;i.max=1000}form.append(l,i);return i}
function button(parent,text,fn,disabled=false){const b=el('button',text);b.type='button';b.disabled=disabled;b.onclick=()=>run(fn);parent.append(b);return b}
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data}
async function run(fn){notice.textContent='';try{await fn()}catch(e){notice.textContent=e.message}}
function login(){root.replaceChildren();const s=el('section'),f=el('form');s.append(el('h2','Welcome back'));const account=field(f,'Account name','id');account.autocomplete='username';account.autocapitalize='none';account.spellcheck=false;field(f,'Password','password','password').autocomplete='current-password';f.append(el('p','Use the account name exactly as created. Capital letters matter.'));f.onsubmit=e=>{e.preventDefault();run(async()=>{await api('login',Object.fromEntries(new FormData(f)));await load()})};const b=el('button','Sign in');b.type='submit';f.append(b);s.append(f);root.append(s)}
async function load(){const d=await api('events');csrf=d.csrf;user=d.user;root.replaceChildren();const top=el('p','Signed in as '+user.id+' · '+user.role);root.append(top);if(user.role==='customer'){const s=el('section'),link=el('a','Plan a catering event');link.href='/catering';s.append(el('h2','Your next gathering'),el('p','Share your event, menu, service and contact details in one guided form.'),link);root.append(s)}if(!d.events.length){root.append(el('p',user.role==='caterer'?'No inquiries yet. Customer requests will appear here for your review.':'No inquiries yet. Start with your event details above.'))}
for(const e of d.events){const s=el('section');s.append(el('h2',e.title),el('p',e.guests+' guests'),el('p',e.notes));const q=e.quotes[0];if(q){const progress=el('progress');progress.max=4;progress.value=q.payment_status==='REVIEW_REQUIRED'?2:q.booked?4:q.capture_id&&q.payment_status==='COMPLETED'?3:q.customer_approved?2:1;s.append(progress,el('p','Quote revision '+q.revision),el('p','$'+q.total+' USD'));if(q.payment_status==='REVIEW_REQUIRED'){s.append(el('h2','Payment needs review'),el('p','The caterer must review this payment before booking can proceed. Do not send another payment.'))}else if(q.booked&&q.payment_status==='COMPLETED')s.append(el('h2','Booking confirmed'));else if(q.capture_id&&q.payment_status==='COMPLETED'){s.append(el('p','Payment verified. Awaiting caterer confirmation.'));if(user.role==='caterer')button(s,'Confirm booking',async()=>{await api('book',{quote:q.id});load()})}else if(!q.customer_approved&&user.role==='customer')button(s,'Approve this quote',async()=>{await api('approve',{quote:q.id});load()});else {s.append(el('p',q.customer_approved?'Quote approved.':'Waiting for customer approval.'));if(q.customer_approved&&user.role==='customer'){if(d.sandbox_checkout){if(!q.order_id)button(s,'Continue to PayPal sandbox',async()=>{const r=await api('payment/create',{quote:q.id});window.location.assign(r.result.approval_url)});else {button(s,'Verify and complete sandbox payment',async()=>{await api('payment/capture',{quote:q.id});await load()});button(s,'Refresh payment status',async()=>{await api('payment/reconcile',{quote:q.id});await load()}).className='secondary'}}else s.append(el('p','Sandbox checkout connection required.'))}}}
if(user.role==='caterer'&&(!q||!q.customer_approved)){const f=el('form');const input=field(f,'Price per guest, USD','price','text','25.00');button(f,q?'Approve a new quote revision':'Approve and send quote',async()=>{await api('quote',{event:e.id,price:input.value});load()});s.append(f)}root.append(s)}button(root,'Sign out',async()=>{await api('logout',{});login()}).className='secondary'}
run(async()=>{try{await load()}catch{login()}});
</script></html>
